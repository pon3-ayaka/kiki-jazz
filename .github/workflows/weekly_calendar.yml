name: weekly-calendar
on:
  schedule:
    - cron: '0 1 * * 5' # USTで金曜01:00 = JSTで金曜10:00
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run weekly calendar job
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SRC_CHANNELS: ${{ secrets.SRC_CHANNELS }}
          DEST_CHANNEL: ${{ secrets.DEST_CHANNEL }}
          CLOSE_REACTIONS: ${{ vars.CLOSE_REACTIONS || 'no_entry,white_check_mark' }}
          CLOSE_KEYWORDS: ${{ vars.CLOSE_KEYWORDS || '締切,〆切,クローズ,closed,close' }}
          FREE_CHANNELS: ${{ vars.FREE_CHANNELS }}
          PAID_CHANNELS: ${{ vars.PAID_CHANNELS }}
          OTHER_CHANNELS: ${{ vars.OTHER_CHANNELS }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          SLACK_BOT_TOKEN_DEBUG: ${{ secrets.SLACK_BOT_TOKEN_DEBUG }}
          SRC_CHANNELS_DEBUG: ${{ secrets.SRC_CHANNELS_DEBUG }}
          DEST_CHANNEL_DEBUG: ${{ secrets.DEST_CHANNEL_DEBUG }}
          FREE_CHANNELS_DEBUG: ${{ vars.FREE_CHANNELS_DEBUG }}
          PAID_CHANNELS_DEBUG: ${{ vars.PAID_CHANNELS_DEBUG }}
          OTHER_CHANNELS_DEBUG: ${{ vars.OTHER_CHANNELS_DEBUG }}
        run: python tools/weekly_calendar.py